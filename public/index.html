<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Hermes Agent — Control Console</title>
  <link rel="stylesheet" href="/css/styles.css?v=8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
</head>
<body>

  <!-- LOGIN OVERLAY -->
  <div id="login-overlay" class="overlay">
    <div class="login-card">
      <div class="login-icon">🔐</div>
      <h1 class="login-title">Hermes Agent</h1>
      <p class="login-subtitle">Enter your access token to initialize a secure session.</p>
      <div id="login-error" class="login-error hidden"></div>
      <form id="login-form">
        <input type="password" id="auth-token" class="input-field" placeholder="Access Token" autocomplete="off" spellcheck="false" autofocus>
        <button type="submit" id="login-btn" class="btn-primary">
          <span id="login-btn-text">Authenticate</span>
          <span id="login-btn-spinner" class="spinner hidden"></span>
        </button>
      </form>
      <div class="login-footer">
        <span class="status-dot offline"></span>
        <span id="login-status-text">Disconnected</span>
      </div>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <main id="dashboard" class="dashboard hidden">

    <!-- Sidebar backdrop (mobile) -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- LEFT: Sessions Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button id="new-session-btn" class="btn-icon sidebar-header-btn" title="New session">+</button>
        <h2 class="sidebar-title">Sessions</h2>
        <button id="sidebar-close-btn" class="btn-icon sidebar-header-btn" title="Close">✕</button>
      </div>
      <div id="session-list" class="session-list"></div>
    </aside>

    <!-- CENTER: Terminal / Chat Log -->
    <section class="panel panel-terminal">
      <header class="panel-header">
        <div class="panel-header-left">
          <button id="show-sidebar-btn" class="btn-icon" title="Show sessions">☰</button>
          <span id="conn-indicator" class="status-dot offline"></span>
          <h2 class="panel-title" id="session-title">New Session</h2>
        </div>
        <div class="panel-header-right">
          <!-- Token Usage Bar -->
          <div id="token-bar" class="token-bar">
            <div id="token-fill" class="token-fill" style="width:0%"></div>
          </div>
          <span id="token-label" class="token-label">0 tokens</span>
          <!-- Model Selector -->
          <select id="model-select" class="model-select">
            <option value="">Loading models...</option>
          </select>
          <button id="clear-btn" class="btn-icon" title="Clear log">✕</button>
          <button id="mobile-code-toggle" class="btn-icon mobile-code-toggle" title="Toggle code viewer" style="display:none">&lt;/&gt;</button>
        </div>
      </header>

      <div id="terminal-stream" class="terminal-stream"></div>

      <footer class="input-bar">
        <form id="cmd-form">
          <input type="text" id="cmd-input" class="input-field input-command" placeholder="Instruct the agent..." autocomplete="off" spellcheck="false" disabled>
          <button type="submit" id="send-btn" class="btn-send" disabled title="Send (Enter)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </form>
        <div class="input-bar-footer">
          <span class="text-muted text-xs">↑↓ History · Enter to send</span>
          <span id="cmd-counter" class="text-muted text-xs"></span>
        </div>
      </footer>
    </section>

    <!-- RIGHT PANEL: Code / Diff Viewer -->
    <section id="panel-code" class="panel panel-code">
      <header class="panel-header">
        <div class="panel-header-left">
          <h2 class="panel-title">Code Viewer</h2>
        </div>
        <div class="panel-header-right">
          <button class="btn-icon btn-tab active" data-view="code">Code</button>
          <button class="btn-icon btn-tab" data-view="diff">Diff</button>
          <button id="code-close-btn" class="btn-icon code-close-btn" title="Close code viewer" style="display:none">✕</button>
        </div>
      </header>
      <div id="code-filename" class="code-filename">No file loaded</div>
      <div id="code-canvas" class="code-canvas">
        <pre><code id="code-content">// Waiting for agent output...</code></pre>
      </div>
      <div id="diff-canvas" class="code-canvas hidden">
        <pre><code id="diff-content">// Diff view will appear here...</code></pre>
      </div>
    </section>
  </main>

  <script src="/js/auth.js?v=8"></script>
  <script src="/js/ws-client.js?v=8"></script>
  <script src="/js/terminal.js?v=8"></script>
  <script src="/js/app.js?v=8"></script>
  <script src="/js/sw-register.js?v=8"></script>
</body>
</html>
