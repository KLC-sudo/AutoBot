<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Agent — Control Console</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LOGIN OVERLAY                                                  -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <div id="login-overlay" class="overlay">
    <div class="login-card">
      <div class="login-icon">🔐</div>
      <h1 class="login-title">Hermes Agent</h1>
      <p class="login-subtitle">Enter your access token to initialize a secure session.</p>

      <div id="login-error" class="login-error hidden"></div>

      <form id="login-form" onsubmit="return handleLogin(event)">
        <input
          type="password"
          id="auth-token"
          class="input-field"
          placeholder="Access Token"
          autocomplete="off"
          spellcheck="false"
          autofocus
        >
        <button type="submit" id="login-btn" class="btn-primary">
          <span id="login-btn-text">Authenticate</span>
          <span id="login-btn-spinner" class="spinner hidden"></span>
        </button>
      </form>

      <div class="login-footer">
        <span class="status-dot offline"></span>
        <span id="login-status-text">Disconnected</span>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- MAIN DASHBOARD                                                 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <main id="dashboard" class="dashboard hidden">

    <!-- LEFT PANEL: Terminal / Chat Log -->
    <section class="panel panel-terminal">
      <header class="panel-header">
        <div class="panel-header-left">
          <span id="conn-indicator" class="status-dot offline"></span>
          <h2 class="panel-title">Execution Log</h2>
        </div>
        <div class="panel-header-right">
          <span id="conn-label" class="connection-label">Disconnected</span>
          <button id="clear-btn" class="btn-icon" title="Clear log" onclick="clearTerminal()">✕</button>
        </div>
      </header>

      <div id="terminal-stream" class="terminal-stream"></div>

      <footer class="input-bar">
        <form id="cmd-form" onsubmit="return dispatchCommand(event)">
          <input
            type="text"
            id="cmd-input"
            class="input-field input-command"
            placeholder="Instruct the agent..."
            autocomplete="off"
            spellcheck="false"
            disabled
          >
          <button type="submit" id="send-btn" class="btn-send" disabled title="Send (Enter)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </form>
        <div class="input-bar-footer">
          <span class="text-muted text-xs">↑↓ History · Enter to send</span>
          <span id="cmd-counter" class="text-muted text-xs">0 commands</span>
        </div>
      </footer>
    </section>

    <!-- RIGHT PANEL: Code / Diff Viewer -->
    <section class="panel panel-code">
      <header class="panel-header">
        <div class="panel-header-left">
          <h2 class="panel-title">Code Viewer</h2>
        </div>
        <div class="panel-header-right">
          <button class="btn-icon btn-tab active" data-view="code" onclick="switchCodeView('code')">Code</button>
          <button class="btn-icon btn-tab" data-view="diff" onclick="switchCodeView('diff')">Diff</button>
        </div>
      </header>

      <div id="code-filename" class="code-filename">No file loaded</div>

      <div id="code-canvas" class="code-canvas">
        <pre><code id="code-content">// Waiting for agent output...</code></pre>
      </div>

      <div id="diff-canvas" class="code-canvas hidden">
        <pre><code id="diff-content">// Diff view will appear here...</code></pre>
      </div>
    </section>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/ws-client.js"></script>
  <script src="/js/terminal.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
